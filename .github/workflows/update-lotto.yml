# 매주 월요일 09:00 KST(00:00 UTC)에 로또 당첨번호 자동 수집 후 docs/ 갱신
name: Update Lotto Data

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch lotto and build
        run: python update_lotto_auto.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/ static/data.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "chore: 로또 당첨번호 자동 갱신" && git push)
